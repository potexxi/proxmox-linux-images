name: Build Ubuntu 2404 Ghrunner

on:
  workflow_dispatch:
    inputs:
      proxmox_ssh_host:
        required: true
      vm_id:
        required: false
        default: ''
      vm_name:
        required: false
        default: 'ubuntu-2404-ghrunner'
      vm_cores:
        required: false
        default: '2'
      vm_memory:
        required: false
        default: '2048'
      proxmox_storage:
        required: false
        default: 'local-lvm'
      vm_bridge:
        required: false
        default: 'vmbr0'
      proxmox_iso:
        required: false
        default: 'local:iso/ubuntu-2404-server.iso'

env:
  PKR_VAR_proxmox_ssh_host: ${{ github.event.inputs.proxmox_ssh_host }}
  PKR_VAR_vm_id: ${{ github.event.inputs.vm_id || '0' }}
  PKR_VAR_vm_name: ${{ github.event.inputs.vm_name }}
  PKR_VAR_vm_cores: ${{ github.event.inputs.vm_cores }}
  PKR_VAR_vm_memory: ${{ github.event.inputs.vm_memory }}
  PKR_VAR_proxmox_storage: ${{ github.event.inputs.proxmox_storage }}
  PKR_VAR_vm_bridge: ${{ github.event.inputs.vm_bridge }}
  PKR_VAR_proxmox_ssh_user: ${{ secrets.PROXMOX_SSH_USER }}
  PKR_VAR_proxmox_ssh_port: ${{ secrets.PROXMOX_SSH_PORT }}
  PKR_VAR_proxmox_iso: ${{ github.event.inputs.proxmox_iso }}

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Packer
        run: |
          if ! command -v packer >/dev/null; then
            curl -fsSL -o /tmp/packer.zip https://releases.hashicorp.com/packer/1.16.0/packer_1.16.0_linux_amd64.zip
            sudo unzip -o /tmp/packer.zip -d /usr/local/bin
          fi

      - name: Packer init
        working-directory: ubuntu_2404_ghrunner
        run: packer init .

      - name: Packer build (VM creation only)
        working-directory: ubuntu_2404_ghrunner
        run: packer build .
