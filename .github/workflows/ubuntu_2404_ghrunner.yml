name: Build Ubuntu 2404 Ghrunner

on:
  workflow_dispatch:
    inputs:
      proxmox_ssh_host:
        required: true
      vm_id:
        required: false
        default: ''
      vm_name:
        required: false
        default: 'ubuntu-2404-ghrunner'
      proxmox_img:
        required: false
        default: 'local:img/noble-server-cloudimg-amd64.img'
      vm_cores:
        required: false
        default: '2'
      vm_memory:
        required: false
        default: '2048'
      vm_disk_size_gb:
        required: false
        default: '20'
      proxmox_storage:
        required: false
        default: 'local-lvm'
      vm_bridge:
        required: false
        default: 'vmbr0'

env:
  PKR_VAR_proxmox_ssh_host: ${{ github.event.inputs.proxmox_ssh_host }}
  PKR_VAR_vm_id: ${{ github.event.inputs.vm_id || '0' }}
  PKR_VAR_vm_name: ${{ github.event.inputs.vm_name }}
  PKR_VAR_vm_cores: ${{ github.event.inputs.vm_cores }}
  PKR_VAR_vm_memory: ${{ github.event.inputs.vm_memory }}
  PKR_VAR_proxmox_storage: ${{ github.event.inputs.proxmox_storage }}
  PKR_VAR_vm_bridge: ${{ github.event.inputs.vm_bridge }}
  PKR_VAR_proxmox_ssh_user: ${{ secrets.PROXMOX_SSH_USER }}
  PKR_VAR_proxmox_ssh_port: ${{ secrets.PROXMOX_SSH_PORT }}
  PKR_VAR_proxmox_img: ${{ github.event.inputs.proxmox_img }}
  PKR_VAR_vm_disk_size_gb: ${{ github.event.inputs.vm_disk_size_gb }}
  PKR_VAR_ssh_private_key_path: "key"

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Packer (non-interactive)
        env:
          PACKER_VERSION: '1.16.0'
        run: |
          set -e
          if command -v packer >/dev/null 2>&1; then
            echo "packer already installed: $(packer version)"
            exit 0
          fi

          echo "Downloading packer ${PACKER_VERSION}"
          curl -fsSL -o /tmp/packer.zip "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip"

          # First try a user-local install to avoid requiring sudo/password prompts
          TARGET_DIR="$HOME/.local/bin"
          mkdir -p "$TARGET_DIR"

          EXTRACTED=0
          if command -v unzip >/dev/null 2>&1; then
            unzip -j -o /tmp/packer.zip -d "$TARGET_DIR" && EXTRACTED=1 || EXTRACTED=0
          elif command -v python3 >/dev/null 2>&1; then
            python3 -c "import zipfile,sys; zipfile.ZipFile('/tmp/packer.zip').extractall(sys.argv[1])" "$TARGET_DIR" && EXTRACTED=1 || EXTRACTED=0
          elif command -v python >/dev/null 2>&1; then
            python -c "import zipfile,sys; zipfile.ZipFile('/tmp/packer.zip').extractall(sys.argv[1])" "$TARGET_DIR" && EXTRACTED=1 || EXTRACTED=0
          fi

          if [ "$EXTRACTED" -eq 1 ]; then
            chmod +x "$TARGET_DIR/packer"
            if [ -n "${GITHUB_PATH:-}" ]; then
              echo "$TARGET_DIR" >> "$GITHUB_PATH"
            else
              echo "export PATH=\"$TARGET_DIR:$PATH\"" >> "$HOME/.profile"
            fi
            rm -f /tmp/packer.zip
            export PATH="$TARGET_DIR:$PATH"
            echo "Installed packer to $TARGET_DIR: $(packer version)"
            exit 0
          fi

          # If local extraction failed, try sudo non-interactively. Use sudo -n to avoid password prompts.
          if sudo -n true 2>/dev/null; then
            echo "Attempting system-wide install via sudo into /usr/local/bin"
            sudo unzip -o /tmp/packer.zip -d /usr/local/bin
            rm -f /tmp/packer.zip
            echo "Installed packer to /usr/local/bin: $(packer version)"
            exit 0
          fi

          echo "ERROR: Could not install packer non-interactively."
          echo "Tried user-local extraction (unzip/python) and sudo install (non-interactive)."
          echo "If you want automatic install, ensure 'unzip' or 'python3' is available, or configure passwordless sudo for the runner user, or preinstall packer on the runner."
          exit 1

      - name: write ssh private key to file
        working-directory: ubuntu_2404_ghrunner
        run: |
          echo "${{ secrets.PROXMOX_SSH_PRIVATE_KEY }}" > key
          chmod 600 key
      
      - name: Packer init
        working-directory: ubuntu_2404_ghrunner
        run: packer init .
      
      - name: packer validate
        working-directory: ubuntu_2404_ghrunner
        run: packer validate .

      - name: Packer build (VM creation only)
        working-directory: ubuntu_2404_ghrunner
        run: packer build .
