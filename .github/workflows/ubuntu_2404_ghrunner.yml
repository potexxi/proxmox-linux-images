name: Build Ubuntu 2404 Ghrunner

on:
  workflow_dispatch:

env:
  PKR_VAR_proxmox_username: ${{ secrets.PROXMOX_USERNAME }}
  PKR_VAR_proxmox_password: ${{ secrets.PROXMOX_PASSWORD }}
  PKR_VAR_proxmox_url: ${{ secrets.PROXMOX_URL }}
  PKR_VAR_proxmox_node: "default"

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
    
      - name: Install Packer
        run: |
          sudo apt update
          sudo apt install packer
          packer version

      - name: Init Packer Build
        working-directory: ./ubuntu_2404_ghrunner/
        run: |
          packer init .

      - name: Validate Packer Build
        working-directory: ./ubuntu_2404_ghrunner/
        run: |
          packer validate .

      - name: Build Packer Build
        working-directory: ./ubuntu_2404_ghrunner/
        run: |
          packer build .